<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"
     role="img" aria-labelledby="t d">
  <title id="t">GitHub Actions assuming an AWS role through OpenID Connect</title>
  <desc id="d">A GitHub Actions job requests a signed OIDC token from GitHub, presents it to AWS STS
  with the role ARN, STS verifies the signature against the IAM identity provider and checks the
  token's audience and subject claims against the role's trust policy, then returns temporary
  credentials to the job. The trust policy is the security boundary.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b35c00"/>
    </marker>
  </defs>

  <style>
    .bg   { fill:#ffffff }
    .lane { fill:#f7f9fc; stroke:#dbe2ea; stroke-width:1; rx:10 }
    .hdr  { font:700 15px system-ui,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1a202c }
    .box  { fill:#ffffff; stroke:#cbd5e0; stroke-width:1.5; rx:8 }
    .boxk { fill:#fff7ed; stroke:#b35c00; stroke-width:2; rx:8 }
    .lbl  { font:600 13px system-ui,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1a202c }
    .sub  { font:12px system-ui,"Segoe UI",Helvetica,Arial,sans-serif; fill:#4a5568 }
    .mono { font:12px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; fill:#2d3748 }
    .step { font:700 12px system-ui,"Segoe UI",Helvetica,Arial,sans-serif; fill:#ffffff }
    .flow { stroke:#4a5568; stroke-width:1.8; fill:none; marker-end:url(#arrow) }
    .flowk{ stroke:#b35c00; stroke-width:2.2; fill:none; marker-end:url(#arrowOrange) }
    .note { font:italic 12px system-ui,"Segoe UI",Helvetica,Arial,sans-serif; fill:#b35c00 }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="470"/>

  <!-- lanes -->
  <rect class="lane" x="20"  y="56" width="270" height="380"/>
  <rect class="lane" x="355" y="56" width="250" height="380"/>
  <rect class="lane" x="670" y="56" width="290" height="380"/>
  <text class="hdr" x="155" y="40" text-anchor="middle">GitHub</text>
  <text class="hdr" x="480" y="40" text-anchor="middle">AWS STS</text>
  <text class="hdr" x="815" y="40" text-anchor="middle">IAM, in your account</text>

  <!-- github side -->
  <rect class="box" x="44" y="86" width="222" height="58"/>
  <text class="lbl" x="155" y="110" text-anchor="middle">Actions job</text>
  <text class="mono" x="155" y="130" text-anchor="middle">permissions: id-token: write</text>

  <rect class="box" x="44" y="186" width="222" height="58"/>
  <text class="lbl" x="155" y="210" text-anchor="middle">GitHub OIDC issuer</text>
  <text class="sub" x="155" y="230" text-anchor="middle">signs a short-lived JWT</text>

  <!-- sts side -->
  <rect class="box" x="375" y="186" width="210" height="76"/>
  <text class="lbl" x="480" y="212" text-anchor="middle">AssumeRoleWith</text>
  <text class="lbl" x="480" y="230" text-anchor="middle">WebIdentity</text>
  <text class="sub" x="480" y="250" text-anchor="middle">token + role ARN</text>

  <!-- iam side -->
  <rect class="box" x="690" y="106" width="250" height="62"/>
  <text class="lbl" x="815" y="130" text-anchor="middle">OIDC identity provider</text>
  <text class="sub" x="815" y="150" text-anchor="middle">proves GitHub signed it</text>

  <rect class="boxk" x="690" y="226" width="250" height="110"/>
  <text class="lbl" x="815" y="250" text-anchor="middle">Role trust policy</text>
  <text class="mono" x="815" y="272" text-anchor="middle">aud = sts.amazonaws.com</text>
  <text class="mono" x="815" y="292" text-anchor="middle">sub = repo:OWNER/REPO:...</text>
  <text class="note" x="815" y="320" text-anchor="middle">the security boundary</text>

  <!-- 1: job asks github for a token -->
  <path class="flow" d="M 155 144 L 155 182"/>
  <circle cx="133" cy="165" r="10" fill="#4a5568"/>
  <text class="step" x="133" y="169" text-anchor="middle">1</text>

  <!-- 2: job presents it to sts -->
  <path class="flow" d="M 266 215 L 371 215"/>
  <circle cx="318" cy="195" r="10" fill="#4a5568"/>
  <text class="step" x="318" y="199" text-anchor="middle">2</text>

  <!-- 3: sts verifies the signature -->
  <path class="flow" d="M 585 205 L 640 205 L 640 140 L 686 140"/>
  <circle cx="640" cy="172" r="10" fill="#4a5568"/>
  <text class="step" x="640" y="176" text-anchor="middle">3</text>

  <!-- 4: sts checks the conditions -->
  <path class="flowk" d="M 585 243 L 640 243 L 640 280 L 686 280"/>
  <circle cx="640" cy="262" r="10" fill="#b35c00"/>
  <text class="step" x="640" y="266" text-anchor="middle">4</text>

  <!-- 5: credentials back to the job -->
  <path class="flow" d="M 480 262 L 480 372 L 155 372 L 155 338"/>
  <circle cx="318" cy="372" r="10" fill="#4a5568"/>
  <text class="step" x="318" y="376" text-anchor="middle">5</text>
  <rect class="box" x="44" y="300" width="222" height="40"/>
  <text class="lbl" x="155" y="325" text-anchor="middle">temporary credentials</text>

  <!-- footnotes -->
  <text class="sub" x="40" y="412">Nothing is stored. No access key exists on either side.</text>
  <text class="sub" x="40" y="430">Step 4 is the only step that knows which repository you trust.</text>
</svg>
