name: Deploy

# Manual trigger only. This repository is public: workflow_dispatch can only be
# run by someone with write access, which keeps the deploy role out of reach of
# anyone who merely opens a pull request. The role's trust policy is also pinned
# to the default branch.
on:
  workflow_dispatch:

permissions:
  id-token: write      # without this the runner injects no OIDC request vars
  contents: read

# Deploy and destroy never run at the same time, and never cancel each other.
concurrency:
  group: aidlc-demo-infra
  cancel-in-progress: false

env:
  PROJECT: aidlc-demo
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # The operator address is a secret so GitHub masks it in every log line,
  # including terraform plan output.
  TF_VAR_operator_cidr: ${{ secrets.OPERATOR_CIDR }}
  # Each image is tagged with the commit it was built from.
  TF_VAR_image_tag: ${{ github.sha }}

jobs:
  deploy:
    name: Build, push and apply
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run off the default branch, or without an operator address
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy runs from main only (got $GITHUB_REF). The deploy role trusts that branch alone."
            exit 1
          fi
          if [ -z "$TF_VAR_operator_cidr" ]; then
            echo "::error::Repository secret OPERATOR_CIDR is not set. Set it to <your-ip>/32; see docs/deploy.md."
            exit 1
          fi

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to a commit, not a moving tag. e1253824 is v6.3.0.
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}
          mask-aws-account-id: true

      # Belt and braces: register the account id as a secret value so it is
      # redacted from every later step, wherever it appears (ARNs, the ECR
      # registry host, plan output).
      - name: Mask the account id
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${ACCOUNT_ID}"
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"

      # Partial backend configuration, written on the runner only. Never committed.
      - name: Write backend.hcl
        run: |
          cat > infra/backend.hcl <<HCL
          bucket       = "${PROJECT}-tfstate-${ACCOUNT_ID}"
          key          = "${PROJECT}/terraform.tfstate"
          region       = "${AWS_REGION}"
          encrypt      = true
          use_lockfile = true
          HCL

      # hashicorp/setup-terraform v4.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=infra init -backend-config=backend.hcl

      # The ECS service needs an image in the repository, and the repository is
      # created by this module. Creating just the repository first makes the same
      # job work on a fresh account and on every run after; once the repository
      # exists this step changes nothing.
      - name: Ensure the ECR repository exists
        run: terraform -chdir=infra apply -target=aws_ecr_repository.app -auto-approve

      - name: Log in to ECR
        run: |
          REPO="$(aws ecr describe-repositories --repository-names "$PROJECT" \
            --query 'repositories[0].repositoryUri' --output text)"
          echo "REPO=${REPO}" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"

      # Tags are immutable, so re-running the same commit must reuse its image
      # rather than fail trying to push the tag again.
      - name: Build and push the image
        run: |
          if aws ecr describe-images --repository-name "$PROJECT" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "image for $GITHUB_SHA already in ECR; not rebuilding"
            exit 0
          fi
          # No provenance/SBOM attestations: with them, the runner pushes an OCI
          # image index, which ECR basic scanning does not scan. Without them the
          # tag points at a single image manifest, which it does.
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            -t "${REPO}:${GITHUB_SHA}" app/
          docker push "${REPO}:${GITHUB_SHA}"
          echo "pushed media type: $(aws ecr describe-images --repository-name "$PROJECT" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageManifestMediaType' --output text)"

      # Informational only: printed, never gating.
      - name: Image scan summary
        continue-on-error: true
        run: |
          # The scan starts a few seconds after the push, and until then ECR
          # answers ScanNotFound, which makes the built-in waiter fail at once.
          # Poll for up to 3 minutes instead.
          for _ in $(seq 1 36); do
            status="$(aws ecr describe-image-scan-findings --repository-name "$PROJECT" \
              --image-id imageTag="$GITHUB_SHA" --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)"
            echo "scan status: $status"
            case "$status" in COMPLETE) break ;; FAILED|UNSUPPORTED_IMAGE) exit 1 ;; esac
            sleep 5
          done
          [ "$status" = COMPLETE ] || { echo "::warning::Scan did not complete within 3 minutes"; exit 1; }
          echo "Scan findings by severity (empty means none):"
          aws ecr describe-image-scan-findings --repository-name "$PROJECT" \
            --image-id imageTag="$GITHUB_SHA" \
            --query 'imageScanFindings.findingSeverityCounts' --output table

      - name: terraform plan
        run: terraform -chdir=infra plan -out=tfplan

      - name: terraform apply
        run: terraform -chdir=infra apply tfplan

      # The circuit breaker rolls a failed deployment back, after which the
      # service is "stable" again on the OLD image. So waiting is not enough:
      # also check that the service is now running the image just pushed.
      - name: Wait for the service to be stable on this commit
        run: |
          aws ecs wait services-stable --cluster "$PROJECT" --services "$PROJECT"
          TD="$(aws ecs describe-services --cluster "$PROJECT" --services "$PROJECT" \
            --query 'services[0].taskDefinition' --output text)"
          IMAGE="$(aws ecs describe-task-definition --task-definition "$TD" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)"
          case "$IMAGE" in
            *":${GITHUB_SHA}") echo "service is stable on ${GITHUB_SHA}" ;;
            *) echo "::error::Service is stable on a different image (rolled back?): ${IMAGE##*:}"; exit 1 ;;
          esac

      - name: Why the tasks stopped (on failure)
        if: failure()
        run: |
          ARNS="$(aws ecs list-tasks --cluster "$PROJECT" --service-name "$PROJECT" \
            --desired-status STOPPED --query 'taskArns[:5]' --output text || true)"
          if [ -n "$ARNS" ] && [ "$ARNS" != "None" ]; then
            # shellcheck disable=SC2086  # $ARNS is a list of task ARNs; splitting is intended
            aws ecs describe-tasks --cluster "$PROJECT" --tasks $ARNS \
              --query 'tasks[].{stopped:stoppedReason,containers:containers[].reason}' --output yaml
          fi
          echo "A task that cannot pull its image usually means it has no public IP; see docs/deploy.md."

      # The task's public address changes on every deployment (no load balancer),
      # so it is read here rather than known in advance. It is not a secret.
      - name: Find the service address
        run: |
          TASK="$(aws ecs list-tasks --cluster "$PROJECT" --service-name "$PROJECT" \
            --desired-status RUNNING --query 'taskArns[0]' --output text)"
          ENI="$(aws ecs describe-tasks --cluster "$PROJECT" --tasks "$TASK" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)"
          IP="$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
            --query 'NetworkInterfaces[0].Association.PublicIp' --output text)"
          echo "TASK_IP=${IP}" >> "$GITHUB_ENV"
          echo "Service address: http://${IP}:8080/"
          echo "Service address: \`http://${IP}:8080/\` (reachable from the operator address only)" >> "$GITHUB_STEP_SUMMARY"

      # The runner is not the operator address, so it stands in for "anyone
      # else". It must get no HTTP response at all. Any status code, even an
      # error, means the ingress rule admits more than the operator.
      - name: Assert the service refuses other addresses
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${TASK_IP}:8080/" || true)"
          if [ "$code" != "000" ]; then
            echo "::error::The runner got HTTP ${code} from the service. Ingress is wider than the operator address."
            exit 1
          fi
          echo "correctly unreachable from the runner (no response within 10s)"
